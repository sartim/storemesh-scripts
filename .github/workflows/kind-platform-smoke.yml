name: Kind platform smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: kind-platform-smoke
  cancel-in-progress: true

jobs:
  platform-smoke:
    name: Disposable Kind platform validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STOREMESH_PLATFORM_DIR: ${{ github.workspace }}
      KUBECONFIG: ${{ github.workspace }}/kind-kubeconfig
    steps:
      - name: Check out scripts
        uses: actions/checkout@v4
        with:
          path: storemesh-scripts
      - name: Check out Kind configuration
        uses: actions/checkout@v4
        with:
          repository: sartim/storemesh-kind-cluster
          path: storemesh-kind-cluster
      - name: Check out Argo CD applications
        uses: actions/checkout@v4
        with:
          repository: sartim/storemesh-argocd-repo
          path: storemesh-argocd-repo
      - name: Install Kind
        shell: bash
        run: |
          if ! command -v kind >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64 \
              --output kind
            chmod +x kind
            sudo mv kind /usr/local/bin/kind
          fi
          kind version
      - name: Create disposable cluster
        run: storemesh-scripts/scripts/create-kind-cluster.sh
      - name: Bootstrap local data services
        run: storemesh-scripts/scripts/bootstrap-local-data-services.sh
      - name: Install Argo CD and submit applications
        run: storemesh-scripts/scripts/bootstrap-argocd.sh
      - name: Wait for StoreMesh workloads
        shell: bash
        run: |
          set -euo pipefail
          for namespace in storemesh-user-service storemesh-product-service storemesh-inventory-service storemesh-order-service storemesh-bff storemesh-frontend; do
            for attempt in {1..60}; do
              if kubectl -n "${namespace}" get deployment --no-headers 2>/dev/null | grep -q .; then
                break
              fi
              if [ "${attempt}" -eq 60 ]; then
                echo "Timed out waiting for a deployment in ${namespace}." >&2
                kubectl -n "${namespace}" get all || true
                exit 1
              fi
              sleep 5
            done
            kubectl -n "${namespace}" wait --for=condition=Available deployment --all --timeout=300s
          done
      - name: Validate Istio gRPC enrollment
        run: storemesh-scripts/scripts/validate-istio-grpc.sh
      - name: Validate functional observability traffic
        shell: bash
        run: |
          set -euo pipefail
          # Keep the demo credentials in the existing CI Secret. The Helm
          # release supplies the immutable User Service image tag.
          demo_secret_patch="$(jq -nc \
            --arg customer_email 'demo@storemesh.local' \
            --arg customer_password 'StoreMesh-demo-2026!' \
            --arg admin_email 'admin@storemesh.local' \
            --arg admin_password 'StoreMesh-admin-2026!' \
            '{stringData:{DEMO_CUSTOMER_EMAIL:$customer_email,DEMO_CUSTOMER_PASSWORD:$customer_password,DEMO_ADMIN_EMAIL:$admin_email,DEMO_ADMIN_PASSWORD:$admin_password}}')"
          kubectl -n storemesh-user-service patch secret storemesh-user-service-secrets \
            --type merge --patch "$demo_secret_patch"
          # Product Service still uses the transitional service-JWT boundary,
          # while the BFF forwards the demo user token during this functional
          # smoke test. Disable that interceptor only in this disposable CI
          # cluster so catalog/order traffic can be exercised independently;
          # shared environments must keep Product JWT validation enabled.
          product_secret_patch="$(jq -nc '{stringData:{JWT_SECRET:""}}')"
          kubectl -n storemesh-product-service patch secret storemesh-product-service-secrets \
            --type merge --patch "$product_secret_patch"
          kubectl -n storemesh-product-service rollout restart deployment/storemesh-product-service
          kubectl -n storemesh-product-service rollout status deployment/storemesh-product-service --timeout=300s
          kubectl -n storemesh-bff port-forward svc/storemesh-bff 8080:8080 > /tmp/storemesh-bff-port-forward.log 2>&1 &
          bff_pid=$!
          trap 'kill "${bff_pid}" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            if [ "${attempt}" -eq 60 ]; then cat /tmp/storemesh-bff-port-forward.log; exit 1; fi
            sleep 2
          done
          export STOREMESH_BFF_URL=http://127.0.0.1:8080
          export STOREMESH_TRAFFIC_REQUESTS=20
          storemesh-scripts/scripts/seed-demo-store.sh
          storemesh-scripts/scripts/load-demo-traffic.sh
      - name: Validate observability resources
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n storemesh-monitoring wait --for=condition=Available deployment --all --timeout=300s
          kubectl -n istio-system wait --for=condition=Available deployment/kiali --timeout=300s
          # A single-node Elasticsearch cluster is expected to be yellow when
          # replica shards cannot be allocated. ECK's Ready condition is the
          # correct availability check for this local topology.
          kubectl -n storemesh-logging wait --for=jsonpath='{.status.phase}'=Ready elasticsearch/storemesh-logs --timeout=600s
          for attempt in {1..60}; do
            if kubectl -n storemesh-logging get deployment -l common.k8s.elastic.co/type=kibana --no-headers 2>/dev/null | grep -q .; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "Timed out waiting for the ECK-managed Kibana deployment." >&2
              kubectl -n storemesh-logging get kibana storemesh-logs -o yaml || true
              exit 1
            fi
            sleep 5
          done
          kubectl -n storemesh-logging wait --for=condition=Available deployment --all --timeout=600s
      - name: Run non-destructive platform validation
        run: storemesh-scripts/scripts/validate-local-platform.sh
      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          kubectl get nodes -o wide || true
          kubectl get applications -n argocd -o wide || true
          kubectl get pods -A -o wide || true
          kubectl -n storemesh-logging get elasticsearch storemesh-logs -o yaml || true
          kubectl -n argocd get application eck-logging -o yaml || true
          kubectl -n storemesh-logging get kibana storemesh-logs -o yaml || true
          kubectl -n storemesh-logging logs -l common.k8s.elastic.co/type=kibana --all-containers --tail=200 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -200 || true
      - name: Delete disposable cluster
        if: always()
        run: kind delete cluster --name storemesh
